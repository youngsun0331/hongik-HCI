<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>HCI07장 C311215 이영선</title>
  
    </head>
    <body>
        <h3> Array []로 배열만들기</h3>
        // 배열을 만들어서 별찍기를 한다
        
        <hr>
        <script>
            let plot =[20,5,10,8,13];
            document.write("var plot = [20,5,10,8,13] <br>");
            for(let i=0; i<plot.length;i++){
                for(let j=0;j<plot[i]; j++){
                    document.write("*");
                }
                document.write("<br>");
            }
        </script>
    </body>
</html>
