<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>HCI07장 C311215 이영선</title>
<script>
function pr(msg,arr){
    document.write(msg+arr.toString()+"<br>");
}
</script>
</head>
<body>
<h3>Array 객체의 메소드 활용</h3>
<hr>
<script>

    //function 정의하고 문자열을 추가 , 오름차순, 내림차순 , toString 해보기
let a = new Array("황", "김", "이");
let b = new Array("박");
let c;
pr("배열 a = ", a);
pr("배열 b = ", b);
document.write("<hr>");
c = a.concat(b); // c는 a와 b를 연결한 새 배열
pr("c = a.concat(b)후 c = ", c);
pr("c = a.concat(b)후 a = ", a);
c = a.join("##"); // c는 배열 a를 연결한 문자열
pr("c = a.join() 후 c = ", c);
pr("c = a.join() 후 a = ", a);
c = a.reverse(); // a.reverse()로 a 자체 변경. c는 배열
pr("c= a.reverse() 후 c = ", c);
pr("c= a.reverse() 후 a = ", a);
c = a.slice(1, 2); // c는 새 배열
pr("c= a.slice(1, 2) 후 c = ", c);
pr("c= a.slice(1, 2) 후 a = ", a);
c = a.sort(); // a.sort()는 a 자체 변경. c는 배열
pr("c= a.sort() 후 c = ", c);
pr("c= a.sort() 후 a = ", a);
c = a.toString(); // toString()은 원소 사이에 ","를 넣어 문자열 생성
document.write("a.toString() : " + c); // c 는 문자열
</script>

<h3>Array 객체로 배열 만들기</h3>
<hr>
<script>
    //온도 배열을 만들고 평균을 구한다
    let degree = new Array();
    degree[0] = 30;
    degree[1] = 10;
    degree[2] = 20;
    
    let sum =0;
    for(let i=0;i<degree.length;i++){
        sum += degree[i];
    }
    document.write("평균 온도는 "+ sum/degree.length + " 입니다 <br>");
    //값 추가하고 정렬하는 메소드
    degree.push(40);
    degree.sort();
    c = degree.toString();
    document.write(c+" degree 를 정렬해보았습니다<br>");
    
    c = degree.sort((a,b) => b-a);
    document.write("내림차순으로 정렬해보았습니다" + c+"<br>");
    

    //filter를 통해서 원하는 값만 가져오는 메소드
    //num = degree.filter(a => a >= 19).length;
    
   
    
    let num =0;
    for(let i=0;i<degree.length;i++){
        if(degree[i]>=19){
            num++;
        }
    }
    document.write("19이상 갯수 :" + num+"<br><br>");

</script>
        
    <h3>객체로 현재 시간 알아내기</h3>
    <hr>
    <script>
        let now = new Date(); // 현재 시간 값을 가진 Date 객체 생성
        //현재 시간을 알아내는 메서드
        document.write("현재 시간 : " + now.toUTCString()
        + "<br><hr>");
        document.write(now.getFullYear() + "년도<br>");
        document.write(now.getMonth() + 1 + "월<br>");
        document.write(now.getDate() + "일<br>");
        document.write(now.getHours() + "시<br>");
        document.write(now.getMinutes() + "분<br>");
        document.write(now.getSeconds() + "초<br>");
        document.write(now.getMilliseconds() + "밀리초<br><hr>");
        let next = new Date(2026, 4, 1, 14, 49, 23); // 7은 8월
        document.write("next.toLocaleString() : "
        +next.toLocaleString() + "<br>");

        todayStr = `${now.getFullYear()}/
        ${String(now.getMonth()+1).padStart(2, '0')}/
        ${String(now.getDate()).padStart(2, '0')}`;
        document.write(todayStr);

    </script>


    </body>
